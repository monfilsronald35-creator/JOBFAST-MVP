services:
  - type: web
    name: jobfast-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && (npm run build || true)
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_STAGE
        value: production
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://jobfast-mvp-spzy.vercel.app"
      # ── Secrets: set these in Render Dashboard → Environment (never commit) ──
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false