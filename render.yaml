services:
  - type: web
    name: jobfast-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: npx tsx src/server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_STAGE
        value: production
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://jobfast-mvp-spzy.vercel.app,https://jobfasthq.com,https://app.jobfasthq.com,https://www.jobfasthq.com"
      # ── Secrets: set these in Render Dashboard → Environment (never commit) ──
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false