version: '3.9'

# JOBFAST Global Platform — Full Stack
# Topology: [Clients] → [api-gateway :8080] → [backend :5000] → [Supabase]
#                                                          ↘ [redis]

services:
  api-gateway:
    build:
      context: .
      target: production
    image: jobfast-gateway:latest
    container_name: jobfast-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV:          production
      GATEWAY_PORT:      8080
      BACKEND_URL:       http://backend:5000
      JWT_SECRET:        ${JWT_SECRET}
      INTERNAL_TOKEN:    ${INTERNAL_TOKEN}
      REDIS_URL:         redis://redis:6379
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
      BLOCKED_IPS:       ${BLOCKED_IPS:-}
      DDOS_THRESHOLD:    2000
      MAX_BODY_SIZE_MB:  10
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jobfast-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus:   '0.5'
          memory: '256M'

  backend:
    build:
      context: ../backend
      target: production
    image: jobfast-api:latest
    container_name: jobfast-api
    restart: unless-stopped
    # Internal only — do NOT expose port to host in production
    expose:
      - "5000"
    environment:
      NODE_ENV:                   production
      PORT:                       5000
      SUPABASE_URL:               ${SUPABASE_URL}
      SUPABASE_ANON_KEY:          ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY:  ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET:                 ${JWT_SECRET}
      JWT_REFRESH_SECRET:         ${JWT_REFRESH_SECRET}
      FRONTEND_URL:               ${FRONTEND_URL}
      ALLOWED_ORIGINS:            http://api-gateway:8080
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:      ${STRIPE_WEBHOOK_SECRET}
      REDIS_URL:                  redis://redis:6379
      OPENAI_API_KEY:             ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY:          ${ANTHROPIC_API_KEY}
      INTERNAL_TOKEN:             ${INTERNAL_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jobfast-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus:   '1'
          memory: '512M'

  redis:
    image: redis:7-alpine
    container_name: jobfast-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jobfast-net

networks:
  jobfast-net:
    driver: bridge
