  <body>
    <div id="root">
      <!-- Splash shell — renders before JS hydrates. #050F1E = zero white flash -->
      <div id="jf-shell" style="
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:#050F1E;z-index:9999;
        padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
      ">
        <!-- JOBFAST brand logo -->
        <img
          src="/brand/logo/jobfast-logo.svg"
          alt="JOBFAST"
          width="220"
          height="220"
          style="display:block;max-width:min(56vw,260px);height:auto;"
        />
        <!-- Loading bar -->
        <div style="
          width:52px;height:3px;border-radius:9999px;overflow:hidden;
          background:rgba(255,255,255,0.08);margin-top:28px;
        ">
          <div id="jf-bar" style="
            width:100%;height:100%;border-radius:9999px;
            background:linear-gradient(90deg,#C98800,#FFB800);
            animation:jf-load 1.6s cubic-bezier(0.4,0,0.6,1) infinite;
          "></div>
        </div>
        <style>
          @keyframes jf-load{0%,100%{opacity:1;transform:scaleX(1)}50%{opacity:.3;transform:scaleX(.4)}}
          @media(prefers-reduced-motion:reduce){#jf-bar{animation:none;opacity:.6}}
          body{margin:0;background:#050F1E;}
        </style>
      </div>
    </div>
