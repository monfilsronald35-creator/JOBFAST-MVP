<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430">
  <!--
    JOBFAST Master Logo — Transparent Background
    For use on dark navy (#050B18) backgrounds
    Worker / JOB:  #F5C518 (golden yellow)
    Building / FAST: #FFFFFF (white — visible on dark)
  -->

  <!-- ═══ BUILDINGS ═══ -->
  <!-- Tall building (left of building group) -->
  <rect x="305" y="65" width="92" height="210" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="miter"/>
  <line x1="336" y1="65"  x2="336" y2="275" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="366" y1="65"  x2="366" y2="275" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="305" y1="105" x2="397" y2="105" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="305" y1="145" x2="397" y2="145" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="305" y1="185" x2="397" y2="185" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="305" y1="225" x2="397" y2="225" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="305" y1="265" x2="397" y2="265" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Shorter building (right) -->
  <rect x="402" y="108" width="62" height="167" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="miter"/>
  <line x1="433" y1="108" x2="433" y2="275" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="402" y1="143" x2="464" y2="143" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="402" y1="178" x2="464" y2="178" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="402" y1="213" x2="464" y2="213" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="402" y1="248" x2="464" y2="248" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Ground line -->
  <line x1="38" y1="275" x2="468" y2="275" stroke="#FFFFFF" stroke-width="8"/>

  <!-- ═══ CONSTRUCTION WORKER ═══ -->

  <!-- Hard hat dome -->
  <path d="M 78,140 C 76,46 168,36 168,36 C 168,36 260,46 258,140 Z" fill="#F5C518"/>

  <!-- Hard hat brim -->
  <ellipse cx="168" cy="140" rx="108" ry="18" fill="#F5C518"/>

  <!-- Hat band shadow -->
  <ellipse cx="168" cy="134" rx="95"  ry="11" fill="#C8930A" opacity="0.30"/>

  <!-- Head -->
  <ellipse cx="164" cy="198" rx="58" ry="64" fill="#F5C518"/>

  <!-- Neck -->
  <rect x="145" y="256" width="36" height="18" rx="7" fill="#F5C518"/>

  <!-- Torso core -->
  <path d="
    M 64,275  L 74,243
    C 90,210 122,198 150,203
    C 158,218 162,222 164,222
    C 166,222 170,218 178,203
    C 208,198 240,210 256,243
    L 266,275
    C 208,294 164,295 164,295
    C 164,295 120,294 64,275 Z
  " fill="#F5C518"/>

  <!-- Left arm (extends left) -->
  <path d="
    M 74,243  L 55,265
    C 50,245 56,222 72,212
    C 88,202 112,202 124,207
    L 124,222
    C 104,222 88,234 78,247
    C 68,260 68,270 70,275 Z
  " fill="#F5C518"/>

  <!-- Right arm (extends right) -->
  <path d="
    M 256,243  L 275,265
    C 280,245 274,222 258,212
    C 242,202 218,202 206,207
    L 206,222
    C 226,222 242,234 252,247
    C 262,260 262,270 260,275 Z
  " fill="#F5C518"/>

  <!-- Arm crease shadow -->
  <path d="M 58,250 C 164,240 270,250 270,250 L 268,262 C 268,262 164,252 60,262 Z"
    fill="#B8820A" opacity="0.45"/>

  <!-- ═══ WORDMARK ═══ -->
  <text x="38" y="392"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="114" font-weight="900" fill="#F5C518">JOB</text>
  <text x="248" y="392"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="114" font-weight="900" fill="#FFFFFF">FAST</text>
</svg>