<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    JOBFAST App Icon — Dark Navy Background
    512×512 square — for PWA icons, app stores, home screen
    Worker: #F5C518  Building/FAST: #FFFFFF  BG: #050B18
  -->

  <!-- Background -->
  <rect width="512" height="512" fill="#050B18"/>

  <!-- ═══ BUILDINGS (right side, white on dark) ═══ -->
  <rect x="300" y="58" width="90" height="205" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="miter"/>
  <line x1="330" y1="58"  x2="330" y2="263" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="360" y1="58"  x2="360" y2="263" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="300" y1="97"  x2="390" y2="97"  stroke="#FFFFFF" stroke-width="5"/>
  <line x1="300" y1="136" x2="390" y2="136" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="300" y1="175" x2="390" y2="175" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="300" y1="214" x2="390" y2="214" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="300" y1="253" x2="390" y2="253" stroke="#FFFFFF" stroke-width="5"/>

  <rect x="395" y="100" width="60" height="163" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="miter"/>
  <line x1="425" y1="100" x2="425" y2="263" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="395" y1="134" x2="455" y2="134" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="395" y1="168" x2="455" y2="168" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="395" y1="202" x2="455" y2="202" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="395" y1="236" x2="455" y2="236" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Ground line -->
  <line x1="36" y1="263" x2="460" y2="263" stroke="#FFFFFF" stroke-width="8"/>

  <!-- ═══ WORKER ═══ -->
  <!-- Hard hat dome -->
  <path d="M 68,133 C 66,42 162,32 162,32 C 162,32 258,42 256,133 Z" fill="#F5C518"/>
  <!-- Hat brim -->
  <ellipse cx="162" cy="133" rx="108" ry="18" fill="#F5C518"/>
  <!-- Hat band -->
  <ellipse cx="162" cy="127" rx="95" ry="10" fill="#B8820A" opacity="0.3"/>

  <!-- Head -->
  <ellipse cx="158" cy="190" rx="57" ry="62" fill="#F5C518"/>
  <!-- Neck -->
  <rect x="140" y="246" width="35" height="17" rx="6" fill="#F5C518"/>

  <!-- Torso -->
  <path d="
    M 58,263 L 68,232
    C 84,200 116,188 144,193
    C 152,208 156,212 158,212
    C 160,212 164,208 172,193
    C 202,188 234,200 250,232
    L 260,263
    C 202,282 158,283 158,283
    C 158,283 114,282 58,263 Z
  " fill="#F5C518"/>

  <!-- Left arm -->
  <path d="
    M 68,232 L 48,254
    C 44,235 50,212 66,202
    C 82,192 106,192 118,197
    L 118,212
    C 98,212 82,224 72,237
    C 62,250 62,260 64,263 Z
  " fill="#F5C518"/>

  <!-- Right arm -->
  <path d="
    M 250,232 L 270,254
    C 274,235 268,212 252,202
    C 236,192 212,192 200,197
    L 200,212
    C 220,212 236,224 246,237
    C 256,250 256,260 254,263 Z
  " fill="#F5C518"/>

  <!-- Arm shadow -->
  <path d="M 52,240 C 158,230 264,240 264,240 L 262,252 C 262,252 158,242 54,252 Z"
    fill="#B8820A" opacity="0.4"/>

  <!-- ═══ WORDMARK ═══ -->
  <text x="32" y="390"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="112" font-weight="900" fill="#F5C518">JOB</text>
  <text x="240" y="390"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="112" font-weight="900" fill="#FFFFFF">FAST</text>
</svg>