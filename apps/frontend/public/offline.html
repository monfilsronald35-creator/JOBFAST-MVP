<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>JOBFAST — Pa Konekte</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #050F1E;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 20px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #0A1628;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.035em;
    }
    .logo-job { color: #F0B429; }
    .logo-fast { color: #F8FAFC; }
    .offline-icon {
      font-size: 3rem;
      line-height: 1;
      margin-top: 4px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #F8FAFC;
      margin-top: 4px;
    }
    p {
      font-size: 0.875rem;
      color: rgba(148,163,184,0.75);
      max-width: 280px;
      line-height: 1.65;
    }
    button {
      margin-top: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #D4961A 0%, #F0B429 50%, #F5C842 100%);
      color: #030C19;
      border: none;
      border-radius: 14px;
      font-size: 0.9375rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: -0.01em;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s, transform 0.12s;
    }
    button:active { opacity: 0.85; transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="og" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F5C842"/>
            <stop offset="100%" stop-color="#D4961A"/>
          </linearGradient>
        </defs>
        <path d="M13 2 L5 14 H11 L9 22 L19 10 H13 Z" fill="url(#og)"/>
      </svg>
    </div>
    <div class="logo"><span class="logo-job">JOB</span><span class="logo-fast">FAST</span></div>
    <div class="offline-icon">📡</div>
    <h1>Pa gen koneksyon entènèt</h1>
    <p>Tcheke koneksyon WiFi oswa done selilè ou, epi eseye ankò.</p>
    <button onclick="window.location.reload()">Eseye Ankò</button>
  </div>
</body>
</html>
